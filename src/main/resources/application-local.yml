# Disposable local integration profile. Never silently substitutes for MySQL.
spring:
  datasource:
    url: jdbc:h2:file:./.data/local;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: ''
    driver-class-name: org.h2.Driver
comms:
  registration-enabled: true
